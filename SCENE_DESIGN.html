<main><small>TAIPEI VANGUARD · TACTICAL R4 · 2026-11-23</small><h1>讓每個景點，有自己的打法</h1><p>八種場地結構、十二種任務路線與守衛部署。點選關卡可比較實際碰撞配置、任務位置和撤離方向。</p><nav id="nav"></nav><div class="view"><section><canvas id="map" width="960" height="720"></canvas><div class="legend"><span style="--c:#eed18b">出勤／建議路線</span><span style="--c:#df795f">炸彈</span><span style="--c:#87cfe2">人質</span><span style="--c:#a3d1a1">撤離點</span></div><label><input type="checkbox" id="guards"> 顯示藏點與出擊方向（有劇透）</label></section><section id="info"></section></div><footer>依公開場地特色設計的壓縮遊戲配置，並非建築測繪平面。虛構任務不代表真實事件。101商場／89F為分開出勤，山路採平面碰撞。完整來源與實作範圍列於遊戲內 SCENE_DESIGN.md。<br>操作：WASD移動、空白鍵跳躍、滑鼠左鍵按住連射、R換彈、F互動。拆彈需持續按住F／INTERACT四秒；人質需要親自護送到出口。</footer></main>
